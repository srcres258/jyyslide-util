name: CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixpkgs-unstable
    - run: nix build .
    - name: Process slides
      run: |
        # Find all slide.md in demo/
        find demo -name slide.md -type f | while read -r file; do
          dir=$(dirname "$file")
          echo "Processing $file in $dir"
          ./result/bin/jyyslide "$file"
          if [ -d "$dir/dist" ] && [ -f "$dir/dist/index.html" ]; then
            echo "Success: dist and index.html found in $dir"
          else
            echo "Failure: dist or index.html missing in $dir"
            exit 1
          fi
        done
