[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "jyyslide-util"
dynamic = ["version"]
description = "A utility to generate jyy-style web slides (based on Reveal.js)."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
keywords = ["slides", "reveal.js", "jyy", "presentation", "utility"]
authors = [
  { name = "srcres258", email = "src.res.211@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Issues = "https://github.com/srcres258/jyyslide-util/issues"
Source = "https://github.com/srcres258/jyyslide-util"

[project.scripts]
jyyslide = "jyyslide_util.entry:run"

[tool.hatch.version]
source = "vcs"
